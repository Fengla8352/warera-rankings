<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarEra Country Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<style>
  /* Layout: one dense ledger table under a slim header, like a treasury register. */
  :root {
    --bg: #0d1219;
    --panel: #141b26;
    --line: #253041;
    --fg: #e6ebf2;
    --muted: #8793a6;
    --gold: #d9a73a;
    --good: #4aa8e0;
    --bad: #e0705f;
    --hl: #223049; --head: #1a2331; --dim: #55627a;
    --display: "Bitter", Georgia, serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f3f6fa; --panel: #ffffff; --line: #d3dbe6; --fg: #17202e; --muted: #5a687c;
    --gold: #94650a; --good: #1f78b4; --bad: #c0392b; --hl: #e2eaf6; --head: #edf1f7; --dim: #8e9aac;
  }
  .flag { width: 20px; height: auto; max-height: 15px; margin-right: 8px; vertical-align: -2px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
  .theme { position: relative; width: 62px; height: 32px; padding: 0; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; margin-left: auto; flex: none; }
  .theme::before { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--hl); border: 1px solid var(--gold); transform: translateX(30px); }
  .theme[aria-checked=false]::before { transform: none; }
  .theme svg { position: absolute; top: 7px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme .sun { left: 8px; } .theme .moon { right: 8px; }
  .theme[aria-checked=true] .moon, .theme[aria-checked=false] .sun { stroke: var(--gold); }
  .theme:hover { border-color: var(--muted); }
  .theme:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .theme::before { transition: transform .2s; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font: 700 28px/1.1 var(--display); margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .status { font: 12px var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--good); }
  .dot.err { background: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 8px 10px; border-radius: 4px; min-width: 220px; font: inherit; }
  input[type=search]:focus-visible, th button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 8px 12px; font: 500 13px var(--body); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--hl); color: var(--gold); }
  /* No overflow on desktop: any overflow value turns this box into a scroll container and breaks the sticky header. */
  .scroll { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
  @media (max-width: 1100px) { .scroll { overflow-x: auto; } }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 8px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2), th.t, td.t { text-align: left; }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: normal; vertical-align: bottom; line-height: 1.25; }
  th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; text-align: inherit; }
  th button:hover { color: var(--fg); }
  th.sorted { color: var(--gold); }
  td { font: 13px var(--mono); font-variant-numeric: tabular-nums; }
  td.name { font: 500 14px var(--body); }
  td.name a { color: var(--fg); text-decoration: none; }
  td.name a:hover { color: var(--gold); text-decoration: underline; }
  td.name a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  td.gov { font: 13px var(--body); color: var(--muted); }
  td.rank { color: var(--muted); width: 44px; }
  td.total { color: var(--gold); font-weight: 500; }
  td.neg { color: var(--bad); }
  td.zero { color: var(--dim); }
  tbody tr:hover { background: var(--head); }
  tbody tr:last-child td { border-bottom: 0; }
  .crumb { margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  .crumb[hidden] { display: none; }
  .crumb a { color: var(--muted); }
  .crumb a:hover { color: var(--gold); }
  .crumb h2 { font: 700 20px/1.2 var(--display); margin: 0; }
  .crumb span { color: var(--muted); }
  td.sep { color: var(--muted); font-style: italic; }
  footer { margin-top: 16px; color: var(--muted); font-size: 12px; max-width: 80ch; }
  footer a { color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .dot.live { animation: pulse 2s infinite; } }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>WarEra Country Rankings</h1>
      <p class="sub" id="sub">Countries ranked by daily income, with the income broken down by source. Refreshes every minute.</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="Filter countries…" aria-label="Filter countries">
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="vCountry" aria-pressed="true">Country</button>
      <button type="button" id="vAlliance" aria-pressed="false">Alliance</button>
    </div>
    <div class="seg" role="group" aria-label="Income period">
      <button type="button" id="perDay" aria-pressed="true">Per day</button>
      <button type="button" id="perHour" aria-pressed="false">Per hour</button>
    </div>
    <button type="button" class="theme" id="theme" role="switch" aria-checked="true" aria-label="Dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>

  <div class="crumb" id="crumb" hidden></div>

  <div class="scroll">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td colspan="14" style="text-align:center;color:var(--muted)">Loading countries…</td></tr></tbody>
    </table>
  </div>

  <footer>
    Income figures come from the public WarEra API (hourly values). Per day multiplies them by 24. Unofficial fan project. <a href="/api/countries" target="_blank" rel="noopener">Raw data</a>
  </footer>
</div>

<script>
/* ---------- Settings ---------- */
const REFRESH_MS = 60000;   // once a minute; the server caches the data for 60 s anyway

/* Nationalist State and Mercenary State were removed in v0.28; those countries are Provisional again. */
const GOV = {
  republic: "Republic", homelandFront: "Homeland Front",
  federation: "Federation", plutocracy: "Plutocracy", autocracy: "Autocracy",
};

/* Column definitions. "inc" columns are income amounts, scaled by the per day / per hour toggle. */
const COLUMNS = [
  { key: "name",  label: "Country", get: c => c.name || c.code || c._id, kind: "text", cls: "name" },
  { key: "gov",   label: "Government", get: c => GOV[c.govType] || "Provisional", kind: "text", cls: "gov" },
  { key: "total", label: "Daily income", get: c => c.income?.total, inc: true, cls: "total" },
  { key: "dev",   label: "Development", get: c => c.income?.development, inc: true },
  /* Strategic resources stopped paying money in v0.28, so this column hides itself when every value is 0. */
  { key: "res",   label: "Strategic resources", get: c => c.income?.strategicResourcesBonus, inc: true, hideIfZero: true },
  { key: "emp",   label: "Employee tax", get: c => c.income?.employeeIncomeTax, inc: true },
  { key: "mgr",   label: "Manager tax", get: c => c.income?.managerIncomeTax, inc: true },
  { key: "govb",  label: "Gov. bonus", get: c => c.income?.govType, inc: true },
  { key: "tinc",  label: "Income tax %", get: c => c.taxes?.income },
  { key: "tmgr",  label: "Manager tax %", get: c => c.taxes?.manager },
  { key: "tmkt",  label: "Market tax %", get: c => c.taxes?.market },
  { key: "pop",   label: "Population", get: c => c.currentPopulation },
];

/* ---------- Helpers ---------- */
const isNum = v => typeof v === "number" && isFinite(v);
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function unwrap(payload) {
  let d = Array.isArray(payload) ? payload[0] : payload;
  d = d?.result?.data ?? d;
  return d?.json ?? d;
}
function toList(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === "object") return Object.entries(data).map(([id, c]) => ({ _id: id, ...c }));
  return [];
}

/* ---------- State & render ---------- */
let rows = [], sortKey = "total", sortDir = -1, filter = "", mult = 24;
let view = "country", openId = null, allianceNames = {};
try { if (localStorage.getItem("mult") === "1") mult = 1; } catch (e) {}

const NO_ALLIANCE = "none";
const SHARE = { key: "share", label: "Share of alliance (%)", kind: "num", share: true };
const col = k => COLUMNS.find(c => c.key === k);
const MEMBERS = { key: "members", label: "Countries", get: a => a.members.length, kind: "num" };
const ALLIANCE_NAME = { key: "name", label: "Alliance", get: a => a.name, kind: "text", cls: "name" };
const ALLIANCE_COLS = [ALLIANCE_NAME, MEMBERS, ...["total", "dev", "res", "emp", "mgr", "govb", "pop"].map(col)];
const sum = (list, f) => list.reduce((t, c) => t + (isNum(f(c)) ? f(c) : 0), 0);

/* Group countries by allianceId; countries without one go into a separate "no alliance" group. */
function buildAlliances() {
  const by = new Map();
  for (const c of rows) {
    const id = c.allianceId || NO_ALLIANCE;
    if (!by.has(id)) by.set(id, []);
    by.get(id).push(c);
  }
  return [...by].map(([id, members]) => {
    members.sort((x, y) => (y.income?.total || 0) - (x.income?.total || 0));
    let name = allianceNames[id];
    if (id === NO_ALLIANCE) name = "No alliance";
    else if (!name) {
      const top = members.slice(0, 3).map(m => m.name || m.code).join(", ");
      name = "Alliance of " + top + (members.length > 3 ? " +" + (members.length - 3) : "");
    }
    const inc = k => sum(members, m => m.income?.[k]);
    return {
      _id: id, name, members, none: id === NO_ALLIANCE,
      income: { total: inc("total"), development: inc("development"), strategicResourcesBonus: inc("strategicResourcesBonus"),
                employeeIncomeTax: inc("employeeIncomeTax"), managerIncomeTax: inc("managerIncomeTax"), govType: inc("govType") },
      currentPopulation: sum(members, m => m.currentPopulation),
    };
  });
}

function value(c, item, group) {
  if (c.share) { const t = sum(group, m => m.income?.total); const v = item.income?.total; return t && isNum(v) ? v / t * 100 : null; }
  const v = c.get(item);
  return c.inc && isNum(v) ? v * mult : v;
}
function fmtCell(c, v) {
  if (!isNum(v)) return "—";
  if (c.inc) return nf0.format(v);
  if (c.key === "members") return nf0.format(v);
  return nf2.format(v);
}

function visibleCols(cols, items) {
  return cols.filter(c => !c.hideIfZero || items.some(i => (c.get(i) || 0) !== 0));
}

/* Draws the table for whichever view is active. */
function draw(cols, items, group, linkFor) {
  cols = visibleCols(cols, items);
  if (!cols.some(c => c.key === sortKey)) { sortKey = "total"; sortDir = -1; }
  document.getElementById("head").innerHTML = '<th>#</th>' + cols.map(c => {
    const label = c.key === "total" ? (mult === 24 ? "Daily income" : "Hourly income") : c.label;
    const sorted = c.key === sortKey;
    return `<th class="${sorted ? "sorted" : ""}${c.kind === "text" ? " t" : ""}"><button type="button" data-k="${c.key}">${label}${sorted ? (sortDir < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  }).join("");

  const sc = cols.find(c => c.key === sortKey);
  const list = items
    .filter(i => !filter || String(i.name || "").toLowerCase().includes(filter)
      || (i.members && i.members.some(m => String(m.name || "").toLowerCase().includes(filter))))
    .sort((a, b) => {
      if (a.none !== b.none) return a.none ? 1 : -1;          // "No alliance" always last
      const x = value(sc, a, group), y = value(sc, b, group);
      if (sc.kind === "text") return String(x ?? "").localeCompare(String(y ?? "")) * sortDir;
      const xv = isNum(x) ? x : -Infinity, yv = isNum(y) ? y : -Infinity;
      return xv === yv ? 0 : (xv < yv ? 1 : -1) * -sortDir;
    });

  let rank = 0;
  document.getElementById("body").innerHTML = list.map(item => {
    const r = item.none ? "–" : ++rank;
    return `<tr><td class="rank">${r}</td>` + cols.map(c => {
      const v = value(c, item, group);
      if (c.key === "name") return `<td class="name${item.none ? " sep" : ""}">${flag(item.code)}<a href="${linkFor(item)}">${esc(v)}</a></td>`;
      if (c.kind === "text") return `<td class="${c.cls} t">${esc(v)}</td>`;
      const cls = [c.cls || "", isNum(v) && v < 0 ? "neg" : "", isNum(v) && v === 0 ? "zero" : ""].join(" ");
      return `<td class="${cls}">${fmtCell(c, v)}</td>`;
    }).join("") + "</tr>";
  }).join("") || `<tr><td colspan="${cols.length + 1}" style="text-align:center;color:var(--muted)">Nothing to show.</td></tr>`;
}

function render() {
  const crumb = document.getElementById("crumb");
  const sub = document.getElementById("sub");
  for (const [id, v] of [["vCountry", "country"], ["vAlliance", "alliance"]])
    document.getElementById(id).setAttribute("aria-pressed", view === v);
  document.getElementById("q").placeholder = view === "alliance" && !openId ? "Filter alliances or members…" : "Filter countries…";

  if (view === "country") {
    crumb.hidden = true;
    sub.textContent = "Countries ranked by daily income, with the income broken down by source. Refreshes every minute.";
    draw(COLUMNS, rows, rows, c => "country.html?c=" + encodeURIComponent(c._id));
    return;
  }
  const groups = buildAlliances();
  const open = openId && groups.find(g => g._id === openId);
  if (!open) {
    openId = null;
    crumb.hidden = true;
    sub.textContent = "Alliances ranked by the combined income of their member countries. Click an alliance to see each member.";
    draw(ALLIANCE_COLS, groups, groups, g => "#alliance/" + encodeURIComponent(g._id));
    return;
  }
  const total = open.income.total * mult;
  crumb.hidden = false;
  crumb.innerHTML = `<a href="#alliances">← All alliances</a><h2>${esc(open.name)}</h2><span>${open.members.length} countries · ${nf0.format(total)} ${mult === 24 ? "per day" : "per hour"} combined</span>`;
  sub.textContent = "Income of each member country, and its share of the alliance total.";
  const cols = [];
  for (const c of COLUMNS) { cols.push(c); if (c.key === "total") cols.push(SHARE); }
  draw(cols, open.members, open.members, c => "country.html?c=" + encodeURIComponent(c._id));
}

document.getElementById("head").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k) return;
  if (k === sortKey) sortDir *= -1;
  else { sortKey = k; sortDir = (col(k) || ALLIANCE_NAME).kind === "text" ? 1 : -1; }
  render();
});
document.getElementById("q").addEventListener("input", e => { filter = e.target.value.trim().toLowerCase(); render(); });

/* Routing by URL hash so views can be shared: #alliances and #alliance/<id>. */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = /^alliance\/(.+)$/.exec(h);
  const nv = m || h === "alliances" ? "alliance" : "country";
  const no = m ? m[1] : null;
  if (nv !== view || no !== openId) { sortKey = "total"; sortDir = -1; }
  view = nv; openId = no;
  render();
}
document.getElementById("vCountry").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); route(); });
document.getElementById("vAlliance").addEventListener("click", () => { location.hash = "alliances"; });
window.addEventListener("hashchange", route);

function setMult(m) {
  mult = m;
  try { localStorage.setItem("mult", String(m)); } catch (e) {}
  document.getElementById("perDay").setAttribute("aria-pressed", m === 24);
  document.getElementById("perHour").setAttribute("aria-pressed", m === 1);
  render();
}
document.getElementById("perDay").setAttribute("aria-pressed", mult === 24);
document.getElementById("perHour").setAttribute("aria-pressed", mult === 1);
document.getElementById("perDay").addEventListener("click", () => setMult(24));
document.getElementById("perHour").addEventListener("click", () => setMult(1));


/* ---------- Theme ---------- */
const themeBtn = document.getElementById("theme");
function paintTheme() {
  const light = document.documentElement.dataset.theme === "light";
  themeBtn.setAttribute("aria-checked", String(!light));
  themeBtn.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode");
}
themeBtn.addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", light ? "light" : "dark"); } catch (e) {}
  paintTheme();
});
paintTheme();
const flag = code => /^[a-z]{2}$/.test(code || "")
  ? `<img class="flag" src="https://flagcdn.com/w40/${code}.png" srcset="https://flagcdn.com/w80/${code}.png 2x" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : "";

/* ---------- Loading ---------- */
const dot = document.getElementById("dot"), statusEl = document.getElementById("status");

async function load() {
  try {
    const res = await fetch("/api/countries", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = toList(unwrap(await res.json()));
    if (!list.length) throw new Error("No countries in response");
    rows = list;
    route();
    dot.className = "dot live";
    statusEl.textContent = "Live · updated " + new Date().toLocaleTimeString("en-GB");
  } catch (err) {
    dot.className = "dot err";
    statusEl.textContent = "Update failed (" + err.message + ") · retrying";
  }
}
/* Alliance names come from a separate endpoint; if it has none, the page labels alliances by their top members. */
let namesAt = 0;
async function loadNames() {
  if (Date.now() - namesAt < 600000) return;
  namesAt = Date.now();
  try {
    const res = await fetch("/api/alliances");
    if (!res.ok) return;
    const d = unwrap(await res.json());
    const next = {};
    for (const a of d?.alliances || []) next[a._id] = a.name;
    if (Object.keys(next).length) { allianceNames = next; render(); }
  } catch (e) { /* keep the fallback labels */ }
}
load().then(loadNames);
setInterval(loadNames, 600000);
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
